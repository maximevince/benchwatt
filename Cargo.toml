[workspace]
resolver = "3"
members = ["crates/benchwatt-device", "crates/otii-arc", "crates/benchwatt-cli", "crates/benchwatt-rec", "crates/benchwatt-session", "crates/benchwatt-py", "crates/benchwatt-ppk2", "crates/benchwatt-gpp", "crates/jsdrv-sys", "crates/benchwatt-joulescope", "app/src-tauri"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.1.0"

# The recording engine scans millions of samples for a plot or a statistic;
# without optimisation a debug build of the app pegs a core while recording.
[profile.dev.package.benchwatt-rec]
opt-level = 3
