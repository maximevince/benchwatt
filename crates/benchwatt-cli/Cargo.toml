[package]
name = "benchwatt-cli"
version.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "benchwatt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }

ctrlc = "3"
benchwatt-session = { path = "../benchwatt-session" }
serde_json = "1"

[dev-dependencies]
otii-arc = { path = "../otii-arc" }
