[package]
name = "otii-py"
version.workspace = true
license.workspace = true
edition.workspace = true

[lib]
name = "openotii"
crate-type = ["cdylib"]

[features]
testing = []

[dependencies]
otii-arc = { path = "../otii-arc" }
otii-rec = { path = "../otii-rec" }
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py310"] }
numpy = "0.30.0"
