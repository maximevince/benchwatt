[package]
name = "benchwatt-py"
version.workspace = true
license.workspace = true
edition.workspace = true

[lib]
name = "benchwatt"
crate-type = ["cdylib"]

[features]
testing = ["dep:otii-arc"]

[dependencies]
benchwatt-session = { path = "../benchwatt-session" }
otii-arc = { path = "../otii-arc", optional = true }
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py310"] }
numpy = "0.30.0"
serde_json = "1"
