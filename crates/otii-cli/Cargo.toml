[package]
name = "otii-cli"
version.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "openotii"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
otii-arc = { path = "../otii-arc" }

ctrlc = "3"
otii-rec = { path = "../otii-rec" }
serde_json = "1"
