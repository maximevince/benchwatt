[package]
name = "benchwatt-app"
version.workspace = true
license.workspace = true
edition.workspace = true

# With `custom-protocol` the interface in app/dist is built into the binary, so a
# plain `cargo run` gives the real app. `npm run tauri dev` turns default features
# off and loads the interface from the Vite dev server instead.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
benchwatt-session = { path = "../../crates/benchwatt-session" }
tauri = { version = "2.10", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tauri-plugin-dialog = "=2.8.3"
